<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.sidebar{width:238px;background:#123f35;color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:22px;flex-shrink:0}.brand{font-size:19px;font-weight:800;letter-spacing:.06em;padding:0 10px}.brand small{display:block;font-size:10px;letter-spacing:.16em;color:#b8d0c7;font-weight:600;margin-top:4px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#d7e5df;text-align:left;padding:11px 12px;border-radius:9px;display:flex;gap:11px;align-items:center}.nav button.active,.nav button:hover{background:#ffffff1c;color:white}.nav .ico{width:20px;text-align:center}.sidefoot{margin-top:auto;color:#b8d0c7;font-size:11px;padding:10px}.main{min-width:0;flex:1}.topbar{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-weight:650}.top-actions{display:flex;align-items:center;gap:10px}.user{background:var(--green2);color:var(--green);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700}.content{max-width:1440px;margin:auto;padding:28px 30px 60px}.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}.eyebrow{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em;font-weight:700}.h1{font-size:26px;font-weight:760;letter-spacing:-.03em;margin:3px 0 5px}.sub{color:var(--muted);max-width:720px}.btn{border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:8px;font-weight:650}.btn:hover{border-color:#9bb9ad}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.soft{background:var(--green2);border-color:var(--green2);color:var(--green)}.btn.danger{color:var(--red)}.btn.small{font-size:12px;padding:6px 9px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:white;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.metric{padding:17px}.metric .label{color:var(--muted);font-size:12px;font-weight:600}.metric .num{font-size:27px;font-weight:780;margin:7px 0 2px}.metric .hint{font-size:11px;color:var(--muted)}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:16px}.panel{padding:18px;margin-bottom:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}.paneltitle{font-weight:750;font-size:15px}.muted{color:var(--muted)}.smalltxt{font-size:12px}.list{display:grid;gap:0}.listrow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.listrow:first-child{border-top:0}.name{font-weight:650}.meta{font-size:12px;color:var(--muted);margin-top:3px}.pill{display:inline-flex;align-items:center;border-radius:30px;padding:4px 8px;font-size:11px;font-weight:700;background:#edf0ef;color:#5e6c66;white-space:nowrap}.pill.green{background:#e4f2e9;color:#24734a}.pill.red{background:#fbe9e7;color:#ad443d}.pill.amber{background:#fff3dc;color:#996211}.pill.blue{background:#e8f1fa;color:#356e9c}.progress{height:7px;background:#edf1ef;border-radius:20px;overflow:hidden;margin-top:8px}.progress span{display:block;height:100%;background:#39876c;border-radius:20px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.field{display:grid;gap:5px;margin-bottom:12px}.field label{font-size:12px;color:#52625b;font-weight:700}.field input,.field select,.field textarea,.toolbar input,.toolbar select{border:1px solid #dce4e0;border-radius:8px;padding:9px 10px;background:white;color:var(--ink);min-width:0}.field textarea{min-height:80px;resize:vertical}.toolbar input{min-width:190px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:720px;background:#fff}th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);font-size:12px;vertical-align:middle}th{background:#f7f9f8;color:#64736c;font-size:11px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}.table-actions{display:flex;gap:5px}.empty{padding:32px;text-align:center;color:var(--muted)}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin-bottom:17px;overflow:auto}.tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}.tabs button.active{color:var(--green);font-weight:750;border-color:var(--green)}.gantt{overflow:auto;border:1px solid var(--line);border-radius:9px}.gantt table{min-width:900px}.gantt th:first-child,.gantt td:first-child{position:sticky;left:0;background:#fff;z-index:1;min-width:240px}.gantt th:first-child{background:#f7f9f8}.barcell{height:38px;position:relative;min-width:36px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(100% - 1px),#eef2f0 calc(100% - 1px),#eef2f0 100%)}.bar{height:15px;position:absolute;top:11px;border-radius:5px;background:#8db7a6}.bar.done{background:#38846b}.bar.late{background:#d77b68}.bar span{font-size:10px;color:#fff;padding-left:5px;white-space:nowrap}.modalback{position:fixed;inset:0;background:#10251e66;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modalback.show{display:flex}.modal{background:white;border-radius:14px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 80px #0003}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h3{margin:0;font-size:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.notice{padding:12px 14px;background:#f1f6f3;border:1px solid #dcebe3;border-radius:9px;color:#416456;font-size:12px;margin:12px 0}.notice.warn{background:#fff7e8;border-color:#f2e4c8;color:#8a641e}.filebox{border:1px dashed #b8c9c1;border-radius:10px;padding:18px;text-align:center;background:#fbfdfc}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hidden{display:none!important}.footer-note{font-size:11px;color:var(--muted);margin-top:20px}.mobilemenu{display:none}
@media(max-width:900px){.sidebar{width:205px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.content{padding:22px 18px 45px}.topbar{padding:0 18px}}
@media(max-width:650px){.app{display:block}.sidebar{width:auto;padding:12px 14px;gap:10px}.brand{padding:3px 6px}.nav{display:flex;overflow:auto;gap:4px}.nav button{white-space:nowrap;padding:9px 10px;font-size:12px}.sidefoot{display:none}.topbar{height:54px}.content{padding:18px 13px 40px}.pagehead{display:block}.pagehead>.btn,.pagehead>div>.btn{margin-top:12px}.h1{font-size:23px}.cards{gap:9px}.metric{padding:13px}.metric .num{font-size:23px}.formgrid,.mapping{grid-template-columns:1fr}.span2{grid-column:auto}.top-actions .muted{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
 <div class="brand">OBRA CONTROL<small>GESTIÓN Y SEGUIMIENTO DE OBRA</small></div>
 <nav class="nav" id="nav">
  <button data-page="dashboard" class="active"><span class="ico">▦</span> Panel general</button>
  <button data-page="obras"><span class="ico">▤</span> Mis obras</button>
  <button data-page="planning"><span class="ico">▥</span> Planning</button>
  <button data-page="subcontratas"><span class="ico">⌂</span> Subcontratas</button>
  <button data-page="compras"><span class="ico">▣</span> Compras y materiales</button>
  <button data-page="diario"><span class="ico">☷</span> Diario de obra</button>
  <button data-page="actas"><span class="ico">▤</span> Actas y compromisos</button>
  <button data-page="agenda"><span class="ico">◷</span> Agenda y alertas</button>
 </nav>
 <div class="sidefoot">Prototipo local · Datos guardados en este navegador</div>
</aside>
<main class="main">
 <header class="topbar"><div class="crumb" id="crumb">Panel general</div><div class="top-actions"><span class="muted smalltxt">Espacio personal</span><div class="user">OC</div></div></header>
 <section class="content" id="view"></section>
</main>
</div>
<div class="modalback" id="modalback"><div class="modal"><div class="modalhead"><h3 id="modalTitle">Nuevo registro</h3><button class="btn small" onclick="closeModal()">Cerrar ✕</button></div><div id="modalBody"></div></div></div>
<script>
const STORE='obra-control-v1';
const today=()=>new Date().toISOString().slice(0,10);
const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const uid=()=>Math.random().toString(36).slice(2,9);
const sample={
 projects:[{id:'o1',name:'Reforma local comercial · Demo',client:'Cliente de ejemplo',address:'Madrid',start:'2026-11-16',end:'2027-01-30',status:'En ejecución',demo:true}],
 tasks:[
 {id:'t1',projectId:'o1',code:'01',name:'Implantación y protecciones',start:'2026-11-16',end:'2026-11-18',actualStart:'2026-11-16',actualEnd:'2026-11-18',progress:100,status:'Finalizado',notes:'Dato ficticio'},
 {id:'t2',projectId:'o1',code:'02',name:'Demoliciones y desescombro',start:'2026-11-19',end:'2026-11-25',actualStart:'2026-11-19',actualEnd:'',progress:70,status:'En curso',notes:'Dato ficticio'},
 {id:'t3',projectId:'o1',code:'03',name:'Albañilería y tabiquería',start:'2026-11-26',end:'2026-12-04',actualStart:'',actualEnd:'',progress:0,status:'Pendiente',notes:'Dato ficticio'},
 {id:'t4',projectId:'o1',code:'04',name:'Instalación eléctrica',start:'2026-12-02',end:'2026-12-15',actualStart:'',actualEnd:'',progress:0,status:'Pendiente',notes:'Dato ficticio'},
 {id:'t5',projectId:'o1',code:'05',name:'Climatización',start:'2026-12-05',end:'2026-12-17',actualStart:'',actualEnd:'',progress:0,status:'Pendiente',notes:'Dato ficticio'},
 {id:'t6',projectId:'o1',code:'06',name:'Pavimentos y revestimientos',start:'2026-12-16',end:'2026-12-29',actualStart:'',actualEnd:'',progress:0,status:'Pendiente',notes:'Dato ficticio'},
 {id:'t7',projectId:'o1',code:'07',name:'Remates y limpieza',start:'2027-01-25',end:'2027-01-30',actualStart:'',actualEnd:'',progress:0,status:'Pendiente',notes:'Dato ficticio'}],
 subs:[{id:'s1',projectId:'o1',trade:'Demoliciones',company:'Empresa de ejemplo A',status:'Contratada',start:'2026-11-19',end:'2026-11-25'},{id:'s2',projectId:'o1',trade:'Electricidad',company:'Por asignar',status:'Pendiente',start:'2026-12-02',end:'2026-12-15'}],
 orders:[{id:'p1',projectId:'o1',material:'Pavimento porcelánico',supplier:'Proveedor de ejemplo',orderBy:'2026-11-30',needed:'2026-12-15',delivered:'',status:'Pendiente de solicitar'}],
 diary:[{id:'d1',projectId:'o1',date:'2026-11-24',companies:'Empresa de ejemplo A',works:'Avance de demoliciones en zona de sala.',issues:'Pendiente confirmar retirada de escombros.',photos:'',demo:true}],
 minutes:[{id:'m1',projectId:'o1',date:'2026-11-24',title:'Reunión de coordinación inicial',attendees:'Dirección de obra; subcontrata',topics:'Secuencia de demoliciones y replanteo.',actions:'Confirmar mediciones y fechas de suministro',due:'2026-11-27',status:'Pendiente',demo:true}]
};
let db=load(),page='dashboard',activeProject=db.projects[0]?.id||'',planningTab='gantt',importRows=[],importHeaders=[],importFileName='',pendingImport=[];
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(sample)}catch(e){return structuredClone(sample)}}
function save(){localStorage.setItem(STORE,JSON.stringify(db))}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function projectName(id){return db.projects.find(p=>p.id===id)?.name||'—'}
function statusPill(s){let c=({'Finalizado':'green','Contratada':'green','Recibido':'green','En curso':'blue','Solicitado':'blue','Confirmado':'blue','Retrasado':'red','Bloqueado':'amber','Pendiente':'amber','Pendiente de solicitar':'amber','Por solicitar':'amber','Recibido parcialmente':'amber'})[s]||'';return `<span class="pill ${c}">${esc(s||'Sin estado')}</span>`}
function daysDiff(a,b){if(!a||!b)return 0;return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function overdueTasks(){return db.tasks.filter(t=>t.end<today()&&t.progress<100)}
function alerts(){let a=[];overdueTasks().forEach(t=>a.push({kind:'Planning',title:t.name,detail:projectName(t.projectId)+' · Fin previsto '+t.end,level:'red'}));db.orders.filter(o=>o.status==='Pendiente de solicitar'&&o.orderBy<=plus(today(),7)).forEach(o=>a.push({kind:'Pedido',title:'Solicitar '+o.material,detail:projectName(o.projectId)+' · Fecha límite '+o.orderBy,level:'amber'}));db.subs.filter(s=>s.status!=='Contratada'&&s.start&&s.start<=plus(today(),14)).forEach(s=>a.push({kind:'Contratación',title:'Contratar '+s.trade,detail:projectName(s.projectId)+' · Inicio '+s.start,level:'amber'}));db.minutes.filter(m=>m.status!=='Completado'&&m.due&&m.due<today()).forEach(m=>a.push({kind:'Compromiso',title:m.actions,detail:projectName(m.projectId)+' · Vencido '+m.due,level:'red'}));return a}
function go(p){page=p;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>go(b.dataset.page));
function header(k,title,sub,action=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><div class="h1">${title}</div><div class="sub">${sub}</div></div>${action}</div>`}
function render(){document.getElementById('crumb').textContent=({dashboard:'Panel general',obras:'Mis obras',planning:'Planning',subcontratas:'Subcontratas',compras:'Compras y materiales',diario:'Diario de obra',actas:'Actas y compromisos',agenda:'Agenda y alertas'})[page];let html=({dashboard:dashboard,obras:projectsPage,planning:planningPage,subcontratas:subsPage,compras:ordersPage,diario:diaryPage,actas:minutesPage,agenda:agendaPage})[page]();document.getElementById('view').innerHTML=html;bindPage()}
function dashboard(){let a=alerts(),active=db.projects.filter(p=>p.status!=='Finalizada'),late=overdueTasks().length,orders=db.orders.filter(o=>o.status==='Pendiente de solicitar').length,subs=db.subs.filter(s=>s.status!=='Contratada').length;return header('VISTA GENERAL','Buenos días. Este es el estado de tus obras.','Un resumen operativo de actividad, planificación y próximos compromisos.','<button class="btn primary" onclick="openProject()">＋ Nueva obra</button>')+
`<div class="cards"><div class="card metric"><div class="label">Obras activas</div><div class="num">${active.length}</div><div class="hint">En seguimiento</div></div><div class="card metric"><div class="label">Actividades retrasadas</div><div class="num" style="color:${late?'var(--red)':'inherit'}">${late}</div><div class="hint">Según fecha prevista y avance</div></div><div class="card metric"><div class="label">Pedidos por solicitar</div><div class="num">${orders}</div><div class="hint">Pendientes de gestión</div></div><div class="card metric"><div class="label">Contrataciones pendientes</div><div class="num">${subs}</div><div class="hint">Gremios sin adjudicar</div></div></div>
<div class="grid2"><div class="panel"><div class="panelhead"><div class="paneltitle">Obras en curso</div><button class="btn small" onclick="go('obras')">Ver todas</button></div><div class="list">${active.length?active.map(p=>{let ts=db.tasks.filter(t=>t.projectId===p.id),pct=ts.length?Math.round(ts.reduce((n,t)=>n+Number(t.progress||0),0)/ts.length):0;return `<div class="listrow"><div style="flex:1"><div class="name">${esc(p.name)}</div><div class="meta">${esc(p.address||'')} · Fin previsto ${esc(p.end||'—')}</div><div class="progress"><span style="width:${pct}%"></span></div></div><div style="text-align:right"><b>${pct}%</b><div class="meta">avance medio</div><button class="btn small" onclick="openProjectDetail('${p.id}')">Abrir</button></div></div>`}).join(''):'<div class="empty">Todavía no hay obras. Crea la primera para empezar.</div>'}</div></div>
<div class="panel"><div class="panelhead"><div class="paneltitle">Alertas y próximos pasos</div><span class="pill ${a.length?'amber':'green'}">${a.length} avisos</span></div><div class="list">${a.slice(0,6).map(x=>`<div class="listrow"><div><div class="name">${esc(x.title)}</div><div class="meta">${esc(x.kind)} · ${esc(x.detail)}</div></div><span class="pill ${x.level}">${x.level==='red'?'Urgente':'Pendiente'}</span></div>`).join('')||'<div class="empty">No hay alertas pendientes.</div>'}</div></div></div>
<div class="panel"><div class="panelhead"><div class="paneltitle">Actividad reciente</div><span class="muted smalltxt">Últimos registros</span></div><div class="list">${[...db.diary.map(x=>({date:x.date,title:'Diario: '+x.works,projectId:x.projectId})),...db.minutes.map(x=>({date:x.date,title:'Acta: '+x.title,projectId:x.projectId}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5).map(x=>`<div class="listrow"><div><div class="name">${esc(x.title)}</div><div class="meta">${esc(projectName(x.projectId))}</div></div><span class="muted smalltxt">${esc(x.date)}</span></div>`).join('')||'<div class="empty">La actividad registrada aparecerá aquí.</div>'}</div></div><div class="footer-note">Los datos de demostración están identificados como ficticios. Los datos que añadas se guardan en el almacenamiento local de este navegador.</div>`}
function projectsPage(){return header('CARTERA','Mis obras','Crea y consulta tus obras. Cada obra agrupa planning, subcontratas, pedidos, diario y actas.','<button class="btn primary" onclick="openProject()">＋ Nueva obra</button>')+`<div class="panel"><div class="toolbar"><input id="projectSearch" placeholder="Buscar obra…"><select id="projectFilter"><option value="">Todos los estados</option><option>En ejecución</option><option>Planificada</option><option>Finalizada</option></select></div><div id="projectTable">${projectTable()}</div></div>`}
function projectTable(){if(!db.projects.length)return '<div class="empty">No hay obras creadas.</div>';return `<div class="tablewrap"><table><thead><tr><th>Obra</th><th>Cliente / ubicación</th><th>Fechas</th><th>Avance</th><th>Estado</th><th></th></tr></thead><tbody>${db.projects.map(p=>{let ts=db.tasks.filter(t=>t.projectId===p.id),pct=ts.length?Math.round(ts.reduce((n,t)=>n+Number(t.progress||0),0)/ts.length):0;return `<tr data-name="${esc(p.name.toLowerCase())}" data-status="${esc(p.status)}"><td><b>${esc(p.name)}</b>${p.demo?'<div class="meta">Datos de ejemplo</div>':''}</td><td>${esc(p.client||'—')}<div class="meta">${esc(p.address||'')}</div></td><td>${esc(p.start||'—')}<div class="meta">hasta ${esc(p.end||'—')}</div></td><td><b>${pct}%</b><div class="progress"><span style="width:${pct}%"></span></div></td><td>${statusPill(p.status)}</td><td><div class="table-actions"><button class="btn small" onclick="openProjectDetail('${p.id}')">Abrir</button><button class="btn small" onclick="openProject('${p.id}')">Editar</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function openProject(id=''){let p=db.projects.find(x=>x.id===id)||{};modal(id?'Editar obra':'Nueva obra',`<form id="projectForm"><div class="formgrid"><div class="field span2"><label>Nombre de la obra *</label><input name="name" required value="${esc(p.name||'')}"></div><div class="field"><label>Cliente</label><input name="client" value="${esc(p.client||'')}"></div><div class="field"><label>Dirección / localidad</label><input name="address" value="${esc(p.address||'')}"></div><div class="field"><label>Fecha de inicio</label><input type="date" name="start" value="${esc(p.start||today())}"></div><div class="field"><label>Fin previsto</label><input type="date" name="end" value="${esc(p.end||'')}"></div><div class="field"><label>Estado</label><select name="status">${['Planificada','En ejecución','Finalizada','Suspendida'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div><div class="notice">La ficha de obra es el contenedor de toda la información del proyecto.</div><button class="btn primary">Guardar obra</button></form>`);document.getElementById('projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v=Object.fromEntries(f);if(id)Object.assign(p,v);else{p={id:uid(),...v};db.projects.push(p);activeProject=p.id}save();closeModal();render()}}
function openProjectDetail(id){activeProject=id;go('planning')}
function projectSelect(){return `<select id="projectSelect" aria-label="Seleccionar obra">${db.projects.map(p=>`<option value="${p.id}" ${p.id===activeProject?'selected':''}>${esc(p.name)}</option>`).join('')}</select>`}
function planningPage(){let p=db.projects.find(x=>x.id===activeProject);if(!p&&db.projects.length){activeProject=db.projects[0].id;p=db.projects[0]}return header('PRODUCCIÓN','Planning y seguimiento','Importa el Excel de planificación, revisa las actividades y registra el avance real.','<button class="btn primary" onclick="openTask()">＋ Nueva actividad</button>')+`<div class="toolbar">${projectSelect()}<button class="btn" onclick="document.getElementById('excelFile').click()">↑ Importar Excel</button><input class="hidden" id="excelFile" type="file" accept=".xlsx,.xls,.csv"><button class="btn" onclick="exportTasks()">↓ Exportar CSV</button><button class="btn soft" onclick="downloadSample()">Descargar Excel de ejemplo</button></div>${p?`<div class="tabs"><button class="${planningTab==='gantt'?'active':''}" onclick="planningTab='gantt';render()">Diagrama Gantt</button><button class="${planningTab==='table'?'active':''}" onclick="planningTab='table';render()">Tabla de actividades</button></div><div class="panel"><div class="panelhead"><div><div class="paneltitle">${esc(p.name)}</div><div class="meta">Planificación base y avance real se mantienen separados</div></div><span class="pill blue">${db.tasks.filter(t=>t.projectId===p.id).length} actividades</span></div>${planningTab==='gantt'?gantt(p.id):taskTable(p.id)}</div>`:'<div class="panel empty">Crea una obra para incorporar su planning.</div>'}<div class="notice warn">Importación segura: el sistema compara las actividades importadas con las existentes. Si detecta coincidencias, no modifica automáticamente el avance real; primero muestra una previsualización y pide confirmación.</div><div id="importPreview"></div>`}
function taskTable(pid){let ts=db.tasks.filter(t=>t.projectId===pid);return `<div class="tablewrap"><table><thead><tr><th>Código</th><th>Actividad</th><th>Inicio previsto</th><th>Fin previsto</th><th>Avance</th><th>Estado</th><th>Desviación</th><th></th></tr></thead><tbody>${ts.map(t=>`<tr><td>${esc(t.code||'')}</td><td><b>${esc(t.name)}</b></td><td>${esc(t.start||'—')}</td><td>${esc(t.end||'—')}</td><td><input type="number" min="0" max="100" value="${Number(t.progress)||0}" style="width:65px" onchange="updateProgress('${t.id}',this.value)"> %</td><td>${statusPill(t.status)}</td><td>${t.progress>=100&&t.actualEnd&&t.end?daysDiff(t.end,t.actualEnd)+' días':(t.end<today()&&t.progress<100?'<span style="color:var(--red)">Retrasada</span>':'—')}</td><td><button class="btn small" onclick="openTask('${t.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No hay actividades. Importa un Excel o crea una actividad.</td></tr>'}</tbody></table></div>`}
function gantt(pid){let ts=db.tasks.filter(t=>t.projectId===pid).sort((a,b)=>(a.start||'').localeCompare(b.start||''));if(!ts.length)return '<div class="empty">No hay actividades para mostrar en el Gantt.</div>';let min=ts.map(t=>t.start).filter(Boolean).sort()[0],max=ts.map(t=>t.end).filter(Boolean).sort().at(-1);if(!min||!max)return '<div class="empty">Completa fechas previstas para mostrar el Gantt.</div>';let span=Math.max(1,daysDiff(min,max)+1),weeks=Math.ceil(span/7),ticks=Array.from({length:weeks},(_,i)=>plus(min,i*7));return `<div class="gantt"><table><thead><tr><th>Actividad</th>${ticks.map(d=>`<th>${d.slice(5)}</th>`).join('')}</tr></thead><tbody>${ts.map(t=>{let left=Math.max(0,daysDiff(min,t.start)/span*100),width=Math.max(1,(daysDiff(t.start,t.end)+1)/span*100),cl=t.progress>=100?'done':(t.end<today()?'late':'');return `<tr><td><b>${esc(t.name)}</b><div class="meta">${esc(t.start)} → ${esc(t.end)} · ${t.progress||0}%</div></td><td colspan="${weeks}" class="barcell"><div class="bar ${cl}" style="left:${left}%;width:${Math.min(width,100-left)}%"><span>${t.progress||0}%</span></div></td></tr>`}).join('')}</tbody></table></div><div class="footer-note">Vista Gantt simplificada por semanas. Las barras representan fechas previstas; el avance se registra por separado.</div>`}
function openTask(id=''){let t=db.tasks.find(x=>x.id===id)||{};modal(id?'Editar actividad':'Nueva actividad',`<form id="taskForm"><div class="formgrid"><div class="field"><label>Código</label><input name="code" value="${esc(t.code||'')}"></div><div class="field"><label>Estado</label><select name="status">${['Pendiente','En curso','Finalizado','Bloqueado','Retrasado'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field span2"><label>Descripción *</label><input name="name" required value="${esc(t.name||'')}"></div><div class="field"><label>Inicio previsto</label><input type="date" name="start" value="${esc(t.start||'')}"></div><div class="field"><label>Fin previsto</label><input type="date" name="end" value="${esc(t.end||'')}"></div><div class="field"><label>Inicio real</label><input type="date" name="actualStart" value="${esc(t.actualStart||'')}"></div><div class="field"><label>Fin real</label><input type="date" name="actualEnd" value="${esc(t.actualEnd||'')}"></div><div class="field"><label>Avance (%)</label><input type="number" min="0" max="100" name="progress" value="${Number(t.progress)||0}"></div><div class="field span2"><label>Observaciones</label><textarea name="notes">${esc(t.notes||'')}</textarea></div></div><button class="btn primary">Guardar actividad</button></form>`);document.getElementById('taskForm').onsubmit=e=>{e.preventDefault();let v=Object.fromEntries(new FormData(e.target));v.progress=Math.max(0,Math.min(100,Number(v.progress)||0));v.projectId=activeProject;if(id)Object.assign(t,v);else db.tasks.push({id:uid(),...v});save();closeModal();render()}}
function updateProgress(id,v){let t=db.tasks.find(x=>x.id===id);if(!t)return;t.progress=Math.max(0,Math.min(100,Number(v)||0));if(t.progress===100){t.status='Finalizado';if(!t.actualEnd)t.actualEnd=today()}else if(t.progress>0&&t.status==='Pendiente')t.status='En curso';save();render()}
function bindPage(){let globalProjectSelect=document.getElementById('projectSelect');if(globalProjectSelect)globalProjectSelect.onchange=()=>{activeProject=globalProjectSelect.value;render()};if(page==='obras'){let s=document.getElementById('projectSearch'),f=document.getElementById('projectFilter');let filter=()=>{document.querySelectorAll('#projectTable tbody tr').forEach(r=>r.classList.toggle('hidden',!(r.dataset.name.includes(s.value.toLowerCase())&&(!f.value||r.dataset.status===f.value))))};s.oninput=filter;f.onchange=filter}if(page==='planning'){let ps=document.getElementById('projectSelect');if(ps)ps.onchange=()=>{activeProject=ps.value;render()};let file=document.getElementById('excelFile');if(file)file.onchange=handleFile}}
function handleFile(e){let file=e.target.files[0];if(!file)return;importFileName=file.name;let reader=new FileReader();reader.onload=ev=>{try{let data=ev.target.result,rows;if(file.name.toLowerCase().endsWith('.csv')){rows=parseCSV(new TextDecoder().decode(data))}else{if(!window.XLSX)throw new Error('No se pudo cargar el lector Excel. Comprueba tu conexión y vuelve a intentarlo.');let wb=XLSX.read(data,{type:'array',cellDates:false});let sheet=wb.Sheets[wb.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false})}if(!rows.length)throw new Error('El archivo no contiene filas de datos.');importRows=rows;importHeaders=Object.keys(rows[0]);showMapping()}catch(err){alert('No se pudo leer el archivo: '+err.message)}};reader.readAsArrayBuffer(file)}
function parseCSV(txt){let lines=txt.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(!lines.length)return[];let parse=line=>{let a=[],v='',q=false;for(let i=0;i<line.length;i++){let c=line[i];if(c==='"'&&line[i+1]==='"'&&q){v+='"';i++}else if(c==='"')q=!q;else if(c===','&&!q){a.push(v);v=''}else v+=c}a.push(v);return a};let h=parse(lines[0]);return lines.slice(1).map(l=>Object.fromEntries(parse(l).map((v,i)=>[h[i]||'col'+i,v])))}
function showMapping(){let guesses={code:['codigo','código','id','nº','n'],name:['actividad','tarea','descripción','descripcion','trabajo','partida'],start:['inicio','fecha inicio','comienzo'],end:['fin','fecha fin','finalización','finalizacion','terminación','terminacion'],progress:['avance','progreso','%','% avance'],status:['estado']};let opts=(key)=>`<option value="">— No importar —</option>`+importHeaders.map(h=>`<option value="${esc(h)}" ${guesses[key].some(g=>h.toLowerCase().includes(g))?'selected':''}>${esc(h)}</option>`).join('');let body=`<div class="notice">Archivo: <b>${esc(importFileName)}</b> · ${importRows.length} filas. Asigna las columnas de tu Excel a los campos de OBRA CONTROL.</div><div class="mapping">${[['code','Código'],['name','Actividad / descripción'],['start','Inicio previsto'],['end','Fin previsto'],['progress','Avance (%)'],['status','Estado']].map(([k,l])=>`<div class="field"><label>${l}${k==='name'?' *':''}</label><select id="map_${k}">${opts(k)}</select></div>`).join('')}</div><div class="notice warn">La importación actualiza únicamente datos de planificación. El avance real, fechas reales y observaciones existentes se conservan. Si una actividad coincide por código o descripción, se propone actualizar sus fechas previstas.</div><div class="tablewrap"><table><thead><tr>${importHeaders.slice(0,6).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${importRows.slice(0,3).map(r=>`<tr>${importHeaders.slice(0,6).map(h=>`<td>${esc(r[h])}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn primary" onclick="previewImport()">Previsualizar importación</button><button class="btn" onclick="closeModal()">Cancelar</button></div>`;modal('Importar planning Excel',body)}
function normalizeDate(v){if(!v)return '';if(typeof v==='number'&&window.XLSX){let d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}let s=String(v).trim();if(/^\d{4}-\d{2}-\d{2}/.test(s))return s.slice(0,10);let m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=m[3].length===2?'20'+m[3]:m[3];return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`}return ''}
function previewImport(){let map={};['code','name','start','end','progress','status'].forEach(k=>map[k]=document.getElementById('map_'+k).value);if(!map.name){alert('Debes asignar una columna a Actividad / descripción.');return}pendingImport=importRows.map((r,i)=>({code:map.code?r[map.code]:'',name:String(r[map.name]||'').trim(),start:normalizeDate(map.start?r[map.start]:''),end:normalizeDate(map.end?r[map.end]:''),progress:map.progress?Number(String(r[map.progress]).replace('%','').replace(',','.')):0,status:map.status?String(r[map.status]):'Pendiente',row:i+2})).filter(x=>x.name);let existing=db.tasks.filter(t=>t.projectId===activeProject);pendingImport=pendingImport.map(x=>({...x,match:existing.find(t=>(x.code&&t.code&&String(t.code).toLowerCase()===String(x.code).toLowerCase())||t.name.toLowerCase()===x.name.toLowerCase())}));let newN=pendingImport.filter(x=>!x.match).length,upd=pendingImport.length-newN;modal('Confirmar importación',`<div class="notice">Se han leído <b>${pendingImport.length}</b> actividades: <b>${newN}</b> nuevas y <b>${upd}</b> coincidentes con actividades existentes.</div><div class="tablewrap"><table><thead><tr><th>Actividad</th><th>Inicio</th><th>Fin</th><th>Resultado</th></tr></thead><tbody>${pendingImport.slice(0,30).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.start||'—')}</td><td>${esc(x.end||'—')}</td><td>${x.match?'<span class="pill amber">Actualizar planificación</span>':'<span class="pill green">Nueva actividad</span>'}</td></tr>`).join('')}</tbody></table></div><div class="notice warn">Al confirmar, solo se actualizarán código, descripción y fechas previstas de coincidencias. No se sobrescribirán avance, fechas reales ni observaciones. Esta acción no tiene deshacer: exporta una copia antes si necesitas conservar una versión anterior.</div><button class="btn primary" onclick="commitImport()">Confirmar importación</button> <button class="btn" onclick="closeModal()">Cancelar</button>`)}
function commitImport(){pendingImport.forEach(x=>{if(x.match){Object.assign(x.match,{code:x.code||x.match.code,name:x.name,start:x.start||x.match.start,end:x.end||x.match.end})}else db.tasks.push({id:uid(),projectId:activeProject,code:x.code,name:x.name,start:x.start,end:x.end,progress:0,status:'Pendiente',actualStart:'',actualEnd:'',notes:''})});save();closeModal();render();alert('Importación completada. Se ha conservado el seguimiento real existente.')}
function exportTasks(){let ts=db.tasks.filter(t=>t.projectId===activeProject);let rows=[['Código','Actividad','Inicio previsto','Fin previsto','Avance (%)','Estado','Inicio real','Fin real'],...ts.map(t=>[t.code,t.name,t.start,t.end,t.progress,t.status,t.actualStart,t.actualEnd])];let csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');downloadText(csv,'planning_obra_control.csv','text/csv;charset=utf-8')}
function downloadSample(){let csv='Código,Actividad,Inicio previsto,Fin previsto,Avance (%),Estado\n01,Implantación y protecciones,2026-11-16,2026-11-18,100,Finalizado\n02,Demoliciones y desescombro,2026-11-19,2026-11-25,70,En curso\n03,Albañilería y tabiquería,2026-11-26,2026-12-04,0,Pendiente\n04,Instalación eléctrica,2026-12-02,2026-12-15,0,Pendiente';downloadText(csv,'ejemplo_planning.csv','text/csv;charset=utf-8')}
function downloadText(text,name,type){let b=new Blob(['\ufeff'+text],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}
function genericPage(kind,title,sub,items,fields,addLabel){let list=db[items];return header(kind,title,sub,`<button class="btn primary" onclick="openGeneric('${items}')">＋ ${addLabel}</button>`)+`<div class="toolbar">${projectSelect()}</div><div class="panel"><div class="tablewrap"><table><thead><tr>${fields.map(f=>`<th>${f[1]}</th>`).join('')}<th></th></tr></thead><tbody>${list.filter(x=>x.projectId===activeProject).map(x=>`<tr>${fields.map(f=>`<td>${f[2]==='status'?statusPill(x[f[0]]):esc(x[f[0]]||'—')}</td>`).join('')}<td><button class="btn small" onclick="deleteGeneric('${items}','${x.id}')">Eliminar</button></td></tr>`).join('')||`<tr><td colspan="${fields.length+1}" class="empty">Todavía no hay registros. Añade el primero.</td></tr>`}</tbody></table></div></div>`}
function subsPage(){return genericPage('GESTIÓN DE GREMIOS','Subcontratas','Controla las empresas, gremios y estados de contratación.','subs',[['trade','Gremio'],['company','Empresa'],['status','Estado'],['start','Inicio previsto'],['end','Fin previsto']], 'Añadir subcontrata')}
function ordersPage(){return genericPage('SUMINISTROS','Compras y materiales','Controla qué hay que pedir, cuándo debe llegar y si se ha recibido.','orders',[['material','Material'],['supplier','Proveedor'],['orderBy','Pedir antes de'],['needed','Necesario en obra'],['status','Estado']], 'Añadir pedido')}
function diaryPage(){return genericPage('PRODUCCIÓN','Diario de obra','Registra visitas, trabajos ejecutados, incidencias y observaciones.','diary',[['date','Fecha'],['works','Trabajos realizados'],['companies','Empresas presentes'],['issues','Incidencias']], 'Nuevo parte')}
function minutesPage(){return genericPage('REUNIONES','Actas y compromisos','Registra reuniones y convierte los acuerdos en acciones con fecha límite.','minutes',[['date','Fecha'],['title','Reunión'],['actions','Compromiso / acuerdo'],['due','Fecha límite'],['status','Estado']], 'Nueva acta')}
function openGeneric(items){let configs={subs:{title:'Nueva subcontrata',fields:[['trade','Gremio'],['company','Empresa'],['status','Estado','select',['Por solicitar','Pendiente','Contratada']],['start','Inicio previsto','date'],['end','Fin previsto','date']]},orders:{title:'Nuevo pedido',fields:[['material','Material'],['supplier','Proveedor'],['orderBy','Fecha límite de pedido','date'],['needed','Fecha necesaria en obra','date'],['status','Estado','select',['Pendiente de solicitar','Solicitado','Confirmado','Recibido parcialmente','Recibido']]]},diary:{title:'Nuevo parte de obra',fields:[['date','Fecha','date'],['companies','Empresas presentes'],['works','Trabajos realizados','textarea'],['issues','Incidencias / pendientes','textarea'],['photos','Referencia a fotografías / archivos']]},minutes:{title:'Nueva acta',fields:[['date','Fecha','date'],['title','Título de reunión'],['attendees','Asistentes'],['topics','Temas tratados','textarea'],['actions','Acuerdos y compromisos','textarea'],['due','Fecha límite principal','date'],['status','Estado','select',['Pendiente','En curso','Completado']]]}};let c=configs[items];let form=c.fields.map(([k,l,type,opts])=>`<div class="field ${type==='textarea'?'span2':''}"><label>${l}</label>${type==='select'?`<select name="${k}">${opts.map(o=>`<option>${o}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${k}"></textarea>`:`<input name="${k}" ${type==='date'?'type="date"':''} value="${type==='date'&&k==='date'?today():''}">`}</div>`).join('');modal(c.title,`<form id="genericForm"><div class="formgrid">${form}</div><button class="btn primary">Guardar</button></form>`);document.getElementById('genericForm').onsubmit=e=>{e.preventDefault();db[items].push({id:uid(),projectId:activeProject,...Object.fromEntries(new FormData(e.target))});save();closeModal();render()}}
function deleteGeneric(items,id){if(confirm('¿Eliminar este registro?')){db[items]=db[items].filter(x=>x.id!==id);save();render()}}
function agendaPage(){let a=alerts();return header('ORGANIZACIÓN','Agenda y alertas','Avisos derivados de fechas de planning, pedidos, contrataciones y compromisos.')+`<div class="panel"><div class="panelhead"><div class="paneltitle">Alertas activas</div><span class="pill ${a.length?'amber':'green'}">${a.length} avisos</span></div>${a.map(x=>`<div class="listrow"><div><div class="name">${esc(x.title)}</div><div class="meta">${esc(x.kind)} · ${esc(x.detail)}</div></div><span class="pill ${x.level}">${x.level==='red'?'Urgente':'Revisar'}</span></div>`).join('')||'<div class="empty">No hay alertas pendientes.</div>'}</div><div class="notice">En esta versión las alertas se calculan al abrir la aplicación y se muestran dentro de ella. No hay notificaciones push ni correos automáticos.</div>`}
function modal(title,body){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=body;document.getElementById('modalback').classList.add('show')}
function closeModal(){document.getElementById('modalback').classList.remove('show')}
document.getElementById('modalback').addEventListener('click',e=>{if(e.target.id==='modalback')closeModal()});
if(!localStorage.getItem(STORE)){save()}
render();
</script>
</body></html>
